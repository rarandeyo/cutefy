pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm oxlint --fix {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
      stage_fixed: true

    - name: format
      run: pnpm oxfmt --write {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
      stage_fixed: true

    - name: ast-grep
      run: mise exec -- ast-grep scan {staged_files}
      glob: "*.{ts,tsx,js,jsx}"

    - name: typecheck
      run: pnpm tsgo --noEmit
