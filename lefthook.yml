# parallel: false — lint(--fix)とformat(--write)が同一ファイルへ並行書き込みすると更新が失われうるため
pre-commit:
  parallel: false
  jobs:
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: format
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: ast-grep
      glob: "*.{ts,tsx,js,jsx}"
      run: ast-grep scan {staged_files}
    - name: typecheck
      run: pnpm tsgo --noEmit
