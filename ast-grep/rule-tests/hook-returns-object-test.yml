id: hook-returns-object
valid:
  - const useFoo = () => ({ a, b })
  - function useBar() { return { x, y } }
  - const helper = () => [1, 2, 3]
  - function getValue() { return [a, b] }
invalid:
  - |
    function useFoo() {
      const a = 1;
      return [a, setA];
    }
  - |
    const useBar = () => {
      const x = 1;
      return [x, setX];
    };
  - const useBaz = () => [a, b]
